<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Tähtikortti (handForced): kortti joka pakotetaan käteen. Viisisakarainen
       tähti on setin ainoa terävä säteittäinen muoto — lähin sukulainen on
       g-pika (salama), joka on epäsymmetrinen ja kulkee kulmasta kulmaan. -->
  <symbol id="g-tahti" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2l2.72 5.51 6.08.89-4.4 4.29 1.04 6.06L12 17.09l-5.44 2.86 1.04-6.06-4.4-4.29 6.08-.89z"/>
  </symbol>

  <!-- Tehtavapakka: kaksi IDENTTISTA korttia (8.6x12.0, suhde .714 = 5:7
       kuten Fokuksen kortit) samassa 16 asteen kulmassa, pino siirrettyna
       3.5 yksikkoa. Kulmaero korttien valilla oli umpikuja: samankokoinen
       suorakaide eri kulmassa ei mahdu toisen sisaan milla tahansa
       siirrolla, joten takakortti tyontyi aina kahdesta vastakkaisesta
       nurkasta ylimman yli. Viistous kuuluu siis koko pinolle.
       Rako maskilla, sama tekniikka kuin g-sovissa. -->
  <symbol id="g-pakka" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <mask id="pakka-rako" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff" stroke="none"/>
      <rect x="9.86" y="7.20" width="8.6" height="12.0" rx="1.6" transform="rotate(-16 14.16 13.20)" fill="#000" stroke="#000" stroke-width="3.3"/>
    </mask>
    <rect x="5.54" y="4.80" width="8.6" height="12.0" rx="1.6" transform="rotate(-16 9.84 10.80)" mask="url(#pakka-rako)"/>
    <rect x="9.86" y="7.20" width="8.6" height="12.0" rx="1.6" transform="rotate(-16 14.16 13.20)"/>
  </symbol>
</svg>
