<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Tähtikortti (handForced): kortti joka pakotetaan käteen. Viisisakarainen
       tähti on setin ainoa terävä säteittäinen muoto — lähin sukulainen on
       g-pika (salama), joka on epäsymmetrinen ja kulkee kulmasta kulmaan. -->
  <symbol id="g-tahti" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2l2.72 5.51 6.08.89-4.4 4.29 1.04 6.06L12 17.09l-5.44 2.86 1.04-6.06-4.4-4.29 6.08-.89z"/>
  </symbol>

  <!-- Tehtäväpakka: kolme päällekkäistä korttia sivusta. Erottuu
       g-jatkokortista siten, että pino on umpinainen suorakaide eikä
       nuolella yhdistetty pari. -->
  <symbol id="g-pakka" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.5" y="8.5" width="13" height="12" rx="1.8"/>
    <path d="M6.7 5.8h10.6"/>
    <path d="M8.1 3.2h7.8"/>
  </symbol>
</svg>
