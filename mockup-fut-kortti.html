<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — FUT-kortit: Q-taide taustana, verbi rintakuvana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=Cinzel:wght@600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:rgba(255,255,255,.95);
  --muted:rgba(255,255,255,.72);
  --q1:#a84c28; --q2:#2d5a3d; --q3:#7a6a50; --q4:#9a9a8e;
  --frog:#6b8a30; --frog-deep:#3d7a52;
  --gold:#c49a3a; --gold-hi:#e8c66a; --gold-deep:#6b4f1c;
  --metal-silver:#b8bcc0; --metal-silver-hi:#e2e6ea;
  --table-felt:#1d3527; --table-felt-deep:#10211a;
  --pomo:#a84c28; --pomo-hi:#e8623a;
  --q1-lite:#e8825a; --q2-lite:#5aa86a; --q3-lite:#d8d0ba; --q4-lite:#c4c4b8;
}
body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(ellipse at 50% 30%, var(--table-felt) 0%, var(--table-felt-deep) 75%);
  color:var(--ink); min-height:100vh; padding:2rem 1.5rem 4rem;
}
h1{font-family:'DM Serif Display',serif; font-style:italic; font-weight:400; font-size:1.6rem; text-align:center; margin-bottom:.3rem}
.sub{text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:2.6rem; max-width:720px; margin-inline:auto}
.row{display:flex; flex-wrap:wrap; gap:1.7rem; justify-content:center; align-items:flex-start}
.tag{position:absolute; top:-1.7rem; left:50%; transform:translateX(-50%); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.cardwrap{position:relative; margin-top:1.9rem}

/* ═══════════ KORTTI ═══════════ */
.fut{
  width:250px; aspect-ratio:5/7; border-radius:14px;
  position:relative; isolation:isolate;
  display:flex; flex-direction:column;
  box-shadow:0 14px 34px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.35);
  --tier-lite:var(--q4-lite);
}
.fut--q1{--tier-lite:var(--q1-lite)}
.fut--q2{--tier-lite:var(--q2-lite)}
.fut--q3{--tier-lite:var(--q3-lite)}
.fut--q4{--tier-lite:var(--q4-lite)}

/* ── Q-taide full-bleed taustana ── */
.fut__art{position:absolute; inset:0; z-index:0; border-radius:inherit; overflow:hidden; pointer-events:none}
.fut__art svg.qart{position:absolute; inset:0; width:100%; height:100%}
/* tumma scrim alaosaan tekstien alle + kevyt ylävinjetti */
.fut__art::before{
  content:""; position:absolute; inset:0; z-index:2;
  background:
    linear-gradient(180deg, rgba(8,14,10,.42) 0%, transparent 22%),
    linear-gradient(180deg, transparent 40%, rgba(8,14,10,.55) 62%, rgba(8,14,10,.86) 100%);
}
/* Q3-vaalea taide tarvitsee vahvemman scrimmin */
.fut--q3 .fut__art::before{
  background:
    linear-gradient(180deg, rgba(30,28,20,.5) 0%, rgba(30,28,20,.12) 24%, transparent 40%),
    linear-gradient(180deg, transparent 40%, rgba(24,22,16,.62) 60%, rgba(18,16,12,.92) 100%);
}

/* ── Metallireunus (rarity): kulta = frog/Q1/Q2, hopea = Q3, paljas = Q4 ── */
.fut::before{
  content:""; position:absolute; inset:0; border-radius:14px; padding:2px; z-index:4; pointer-events:none;
  background:linear-gradient(165deg, var(--gold-hi) 0%, var(--gold) 28%, var(--gold-deep) 55%, var(--gold) 80%, var(--gold-hi) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
}
.fut--q3::before{background:linear-gradient(165deg, var(--metal-silver-hi) 0%, var(--metal-silver) 30%, #6a7076 55%, var(--metal-silver) 80%, var(--metal-silver-hi) 100%)}
.fut--q4::before{background:linear-gradient(165deg, rgba(255,255,255,.30), rgba(255,255,255,.10) 50%, rgba(255,255,255,.22))}
.fut::after{
  content:""; position:absolute; inset:2px; border-radius:12px; z-index:3; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.08);
}

/* ── Frog mythic: holo Q-taiteen päällä ── */
.fut--frogcard .fut__art::after{
  content:""; position:absolute; inset:0; z-index:2;
  background:conic-gradient(from 0deg at 50% 50%,
    rgba(255,80,80,.20), rgba(255,220,80,.18), rgba(80,255,160,.20),
    rgba(80,180,255,.18), rgba(200,80,255,.20), rgba(255,80,80,.20));
  mix-blend-mode:color-dodge; opacity:.45; animation:holoSweep 6s linear infinite;
}
@keyframes holoSweep{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fut--frogcard .fut__art::after{animation:none}}

/* ── Yläikkuna: pomodoro-pipit oik., frog-sinetti vas. ── */
.fut__pips{position:absolute; top:10px; right:11px; z-index:5; display:flex; gap:3px}
.fut__pip{
  width:15px; height:15px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--pomo-hi), var(--pomo) 72%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.55);
}
.fut__seal{
  position:absolute; top:9px; left:10px; z-index:5;
  width:27px; height:27px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%, var(--frog-deep), #1d3a28);
  box-shadow:0 0 0 2px var(--gold), 0 0 10px rgba(196,154,58,.55), inset 0 1px 2px rgba(255,255,255,.3);
}
.fut__seal svg{width:16px; height:16px}

/* ── Verbi-rintakuva (pelaajan bust) ── */
.fut__bust{
  position:relative; z-index:1; flex:0 0 52%;
  display:flex; align-items:flex-end; justify-content:center;
}
.fut__bust::before{ /* tumma halo taiteen ja bustin väliin — kuten pelaajakuvan varjostus */
  content:""; position:absolute; left:50%; bottom:-6%; transform:translateX(-50%);
  width:86%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle, rgba(6,12,8,.52) 0%, rgba(6,12,8,.28) 45%, transparent 70%);
}
.fut__bust svg{
  position:relative; width:56%; height:auto; aspect-ratio:1;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.65)) drop-shadow(0 2px 4px rgba(0,0,0,.5));
}

/* ── Nimi + jakoviivat ── */
.fut__name{
  position:relative; z-index:2; text-align:center; padding:0 .85rem;
  font-family:'Cinzel',serif; font-weight:700; font-size:.85rem; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink); text-shadow:0 2px 5px rgba(0,0,0,.75);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.fut__name::before,.fut__name::after{
  content:""; display:block; height:1px; margin:.42rem 1.3rem;
  background:linear-gradient(90deg,transparent,var(--tier-lite) 30%,var(--tier-lite) 70%,transparent);
  opacity:.6;
}

/* ── Statit kahdessa palstassa ── */
.fut__stats{
  position:relative; z-index:2; display:grid; grid-template-columns:1fr 1px 1fr;
  padding:.1rem .95rem .4rem; gap:0 .65rem; align-items:start;
}
.fut__stats .div{background:linear-gradient(180deg,transparent,var(--tier-lite),transparent); opacity:.45; height:100%}
.fut__col{display:flex; flex-direction:column; gap:.26rem}
.fut__stat{display:flex; align-items:baseline; gap:.35rem; font-size:.68rem}
.fut__stat b{font-family:'Cinzel',serif; font-weight:700; font-size:.78rem; color:var(--tier-lite); min-width:1.7em; text-align:right; text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fut__stat span{color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-size:.58rem}

/* ── Verbirivi alimpana ── */
.fut__verbline{
  position:relative; z-index:2; text-align:center; padding-bottom:.65rem;
  font-family:'Cinzel',serif; font-weight:600; font-size:.66rem; letter-spacing:.24em;
  text-transform:uppercase; color:var(--tier-lite); text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.fut__verbline .qword{opacity:.75; letter-spacing:.14em; font-size:.56rem; display:block; margin-top:.18rem}
</style>

<h1>FUT-kortit — lopullinen suunta</h1>
<p class="sub">Q-visuaali taustataiteena (kiire · kasvu · kohina · pysähtyneisyys) · verbi-ikoni rintakuvana kuten pelaaja · ei emojeita · metallireunus rarityn mukaan · sammakko = mythic + holo</p>

<div class="row" id="row"></div>

<script>
const CARDS = [
  {q:'q1', frog:true,  qart:'qart-q1', verb:'Soita', qword:'TEE HETI',    icon:'verb-i-soita',    pomo:3, name:'Soita hammaslääkärille', s1:[['25','min'],['3','pom']], s2:[['TI','päivä'],['TYÖ','proj']]},
  {q:'q1', frog:false, qart:'qart-q1', verb:'Tee',   qword:'TEE HETI',    icon:'verb-i-tee',      pomo:4, name:'Tee veroilmoitus',       s1:[['50','min'],['4','pom']], s2:[['MA','päivä'],['KOTI','proj']]},
  {q:'q2', frog:false, qart:'qart-q2', verb:'Sovi',  qword:'AIKATAULUTA', icon:'verb-i-sovi',     pomo:2, name:'Sovi kehityskeskustelu', s1:[['25','min'],['2','pom']], s2:[['KE','päivä'],['TYÖ','proj']]},
  {q:'q3', frog:false, qart:'qart-q3', verb:'Tarkista', qword:'DELEGOI',  icon:'verb-i-tarkista', pomo:1, name:'Tarkista sähköpostit',   s1:[['15','min'],['1','pom']], s2:[['—','päivä'],['ARKI','proj']]},
  {q:'q4', frog:false, qart:'qart-q4', verb:'Kirjaa', qword:'POISTA',     icon:'verb-i-kirjaa',   pomo:1, name:'Kirjaa kuitit',          s1:[['10','min'],['1','pom']], s2:[['—','päivä'],['ARKI','proj']]},
];
function card(c){
  const stats = col => col.map(([b,s])=>`<div class="fut__stat"><b>${b}</b><span>${s}</span></div>`).join('');
  const pips = '<div class="fut__pips">'+'<span class="fut__pip"></span>'.repeat(c.pomo)+'</div>';
  return `<div class="cardwrap"><span class="tag">${c.frog?'🐸 mythic + ':''}${c.q.toUpperCase()}</span>
  <div class="fut fut--${c.q}${c.frog?' fut--frogcard':''}">
    <div class="fut__art"><svg class="qart"><use href="#${c.qart}"/></svg></div>
    ${pips}
    ${c.frog?'<div class="fut__seal"><svg><use href="#frog-glyph"/></svg></div>':''}
    <div class="fut__bust"><svg><use href="#${c.icon}"/></svg></div>
    <div class="fut__name">${c.name}</div>
    <div class="fut__stats">
      <div class="fut__col">${stats(c.s1)}</div><div class="div"></div>
      <div class="fut__col">${stats(c.s2)}</div>
    </div>
    <div class="fut__verbline">${c.verb}<span class="qword">${c.qword}</span></div>
  </div></div>`;
}
document.getElementById('row').innerHTML = CARDS.map(card).join('');
</script>
