<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; connect-src https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://www.gstatic.com; font-src https://fonts.gstatic.com; style-src 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:">
<meta name="theme-color" content="#071009">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fokus — Selaa tehtäviä</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1a1c18;--paper:#f2f0e8;--warm:#b8a882;--accent:#c49a3a;--muted:#6b7060;--light:#dddbd0;--pomo:#a84c28;--q1:#a84c28;--q2:#2d5a3d;--q3:#7a6a50;--q4:#9a9a8e}
body{background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;height:100dvh;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;overflow:hidden;user-select:none}
#setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:1.5rem;text-align:center}
#setup h2{font-family:'DM Serif Display',serif;font-size:1.5rem;font-style:italic}
#setup p{font-size:.82rem;color:var(--muted);font-weight:300;line-height:1.6;max-width:280px}
.time-opts{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.time-opt{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;padding:.55rem 1.1rem;border-radius:8px;border:1.5px solid var(--light);background:white;color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s,background .15s,transform .15s}
.time-opt.on,.time-opt:hover{border-color:var(--accent);color:var(--accent);background:rgba(196,154,58,.06)}
.time-opt:active{transform:scale(.96)}
.custom-time{display:flex;align-items:center;gap:.5rem}
.custom-time input{width:64px;font-family:'DM Sans',sans-serif;font-size:.85rem;padding:.45rem .6rem;border-radius:6px;border:1.5px solid var(--light);outline:none;text-align:center}
.custom-time input:focus{border-color:var(--accent)}
.start-btn{font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;padding:.75rem 2rem;border-radius:10px;border:none;background:var(--accent);color:white;cursor:pointer;width:100%;max-width:280px}
.skip-setup{font-size:.72rem;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:underline;text-underline-offset:2px}
#main{flex:1;display:none;flex-direction:row;overflow:hidden}
#swipe-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(.85rem + env(safe-area-inset-top,0px)) 1.25rem .6rem;border-bottom:1px solid var(--light);flex-shrink:0}
.hdr-logo{font-family:'DM Serif Display',serif;font-size:1rem;font-style:italic;color:var(--accent)}
.hdr-back{font-size:.72rem;color:var(--muted);font-weight:300;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;min-height:44px;padding:0 .5rem;margin-left:-.5rem}
.hdr-count{font-size:.7rem;color:var(--muted);font-weight:300}
.progress{height:3px;background:var(--light);flex-shrink:0}
.progress-fill{height:100%;background:var(--accent);transition:width .3s ease}
.hints{display:flex;justify-content:space-between;align-items:center;padding:.45rem 1.5rem;flex-shrink:0}
.hint{font-size:.65rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;opacity:.3;transition:opacity .2s}
.hint.left{color:var(--q4)}.hint.right{color:var(--accent)}.hint.active{opacity:1}
.stack{flex:1;display:flex;align-items:center;justify-content:center;padding:.75rem 1.25rem;position:relative;overflow:hidden}
.card-wrap{position:absolute;width:100%;max-width:320px;transition:none;cursor:grab}
.card-wrap.animating{transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.task-card{background:white;border-radius:14px;border:1px solid var(--light);padding:1.4rem;box-shadow:0 4px 20px rgba(0,0,0,.08);min-height:200px;display:flex;flex-direction:column;gap:.8rem;position:relative;overflow:hidden}
.task-card.q1{border-top:3px solid var(--q1)}.task-card.q2{border-top:3px solid var(--q2)}.task-card.q3{border-top:3px solid var(--q3)}.task-card.q4{border-top:3px solid var(--q4)}
.tint{position:absolute;inset:0;border-radius:14px;opacity:0;transition:opacity .1s;pointer-events:none}
.tint.yes{background:rgba(196,154,58,.1)}.tint.no{background:rgba(154,154,142,.1)}
.card-hdr{display:flex;flex-direction:column;gap:.18rem}
.q-badge{display:inline-flex;font-size:.58rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:.18rem .45rem;border-radius:4px;color:white;align-self:flex-start}
.q-badge.q1{background:var(--q1)}.q-badge.q2{background:var(--q2)}.q-badge.q3{background:var(--q3)}.q-badge.q4{background:var(--q4)}
.q-criteria{font-size:.62rem;color:var(--muted);font-weight:300;font-style:italic}
.task-name{font-family:'DM Serif Display',serif;font-size:1.3rem;font-style:italic;line-height:1.3;letter-spacing:-.02em;color:var(--ink);flex:1}
.meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:auto}
.meta-item{font-size:.68rem;color:var(--muted);font-weight:300}
.chip{font-size:.6rem;font-weight:500;padding:.12rem .35rem;border-radius:4px}
.chip.frog{color:#4a6e22;background:rgba(74,110,34,.1)}.chip.inq{color:var(--accent);background:rgba(196,154,58,.1)}.chip.wait{color:#3a6b8a;background:rgba(58,107,138,.1)}
.chip.sched{color:var(--pomo);background:rgba(192,86,33,.1)}
/* Ajastusrivi: kursiivi erottaa sen tehtävän omasta tekstistä. */
.card-sched{font-size:.62rem;font-weight:300;font-style:italic;color:var(--pomo);margin-top:.3rem}
.shadow-card{position:absolute;width:100%;max-width:320px;pointer-events:none}
.shadow-card .task-card{opacity:.4;transform:scale(.94);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.shadow-card.back2 .task-card{opacity:.18;transform:scale(.88)}
.actions{display:flex;justify-content:center;align-items:flex-end;gap:1.25rem;padding:.65rem 1rem 1.1rem;flex-shrink:0}
.act-wrap{display:flex;flex-direction:column;align-items:center;gap:.22rem}
.act-btn{width:50px;height:50px;border-radius:50%;border:2px solid;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:transform .1s,box-shadow .1s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.act-btn:hover{transform:scale(1.08)}.act-btn:active{transform:scale(.95)}
.act-btn.skip{border-color:var(--light);color:var(--muted)}.act-btn.qbtn{border-color:var(--accent);color:var(--accent)}.act-btn.fbtn{border-color:#4a6e22;color:#4a6e22}
.act-label{font-size:.57rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
#queue-panel{width:190px;border-left:1px solid var(--light);background:white;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.qp-hdr{padding:.85rem .9rem .6rem;border-bottom:1px solid var(--light);flex-shrink:0}
.qp-title{font-family:'DM Serif Display',serif;font-size:.92rem;font-style:italic;color:var(--ink)}
.qp-budget{font-size:.63rem;color:var(--muted);font-weight:300;margin-top:.12rem}
.qp-budget.full{color:var(--pomo);font-weight:500}
.budget-warn{margin:.4rem .5rem 0;padding:.45rem .65rem;background:rgba(168,76,40,.07);border:1px solid rgba(168,76,40,.18);border-radius:6px;font-size:.64rem;color:var(--pomo);line-height:1.45;display:none}
.budget-warn.on{display:block}
.qp-list{flex:1;overflow-y:auto;padding:.4rem .5rem}
.qp-empty{font-size:.7rem;color:var(--light);font-style:italic;padding:.65rem .4rem;text-align:center}
.qp-item{display:flex;align-items:flex-start;gap:.35rem;padding:.35rem .3rem;border-radius:5px;margin-bottom:.15rem;background:var(--paper)}
.qp-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:.38rem}
.qp-dot.q1{background:var(--q1)}.qp-dot.q2{background:var(--q2)}.qp-dot.q3{background:var(--q3)}.qp-dot.q4{background:var(--q4)}
.qp-name{font-size:.67rem;font-weight:300;color:var(--ink);flex:1;line-height:1.3;word-break:break-word}
.qp-est{font-size:.58rem;color:var(--muted);flex-shrink:0;white-space:nowrap;margin-top:.08rem}
.qp-rm{background:none;border:none;cursor:pointer;color:var(--light);font-size:.8rem;padding:0;flex-shrink:0;line-height:1}
.qp-rm:hover{color:var(--pomo)}
.qp-total{padding:.45rem .85rem;border-top:1px solid var(--light);font-size:.66rem;color:var(--muted);font-weight:300;flex-shrink:0}
.qp-total strong{color:var(--ink);font-weight:500}
#done-screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:1rem;text-align:center}
#done-screen h2{font-family:'DM Serif Display',serif;font-size:1.3rem;font-style:italic}
#done-screen p{font-size:.8rem;color:var(--muted);font-weight:300;line-height:1.6;max-width:260px}
.done-btn{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;padding:.6rem 1.4rem;border-radius:8px;border:1.5px solid var(--accent);color:var(--accent);background:white;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.done-btn:hover{background:var(--accent);color:white}
.done-btn:active{transform:scale(.97)}
.nt{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:white;border-radius:8px;padding:.55rem 1.1rem;font-size:.78rem;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s ease-out;white-space:nowrap;z-index:200}
.nt.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TEEMA — swipe.html ──────────────────────────────── */
/* Usvametsä = oletus (nykyinen vaalea tyyli) */

/* HAVUMETSÄ */
html[data-theme="havu"]{--ink:rgba(255,255,255,.95);--paper:#0d2218;--warm:#1e4028;--accent:#4fa870;--muted:rgba(255,255,255,.52);--light:#1a3525;--pomo:#c0432b;--q1:#c0432b;--q2:#2d6b3d;--q3:#7a6a50;--q4:#555f52}
html[data-theme="havu"] body{background:#0a1a10;color:rgba(255,255,255,.95)}
html[data-theme="havu"] .task-card{background:#0f2a1a;border-color:#1e4028}
html[data-theme="havu"] #queue-panel{background:#0a1a10;border-left-color:#1a3525}
html[data-theme="havu"] .qp-hdr,.qp-total{border-color:#1e4028}
html[data-theme="havu"] .qp-item{background:#0d2218}
html[data-theme="havu"] .hdr{border-bottom-color:#1e4028}
html[data-theme="havu"] .act-btn{background:#0d2218;border-color:#1e4028}
html[data-theme="havu"] .act-btn.skip{border-color:#1e4028;color:rgba(255,255,255,.45)}
html[data-theme="havu"] .act-btn.qbtn{border-color:#4fa870;color:#4fa870}
html[data-theme="havu"] .act-btn.fbtn{border-color:#6aaa30;color:#6aaa30}
html[data-theme="havu"] .time-opt{background:#0d2218;border-color:#1e4028;color:rgba(255,255,255,.55)}
html[data-theme="havu"] .time-opt.on{border-color:#4fa870;color:#4fa870;background:rgba(79,168,112,.08)}
html[data-theme="havu"] .start-btn{background:#4fa870}
html[data-theme="havu"] .done-btn{background:#0d2218;color:#4fa870;border-color:#4fa870}
html[data-theme="havu"] .done-btn:hover{background:#4fa870;color:white}
html[data-theme="havu"] .progress{background:#1e4028}
html[data-theme="havu"] .nt{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:rgba(255,255,255,.9)}
html[data-theme="havu"] .custom-time input{background:#0d2218;border-color:#1e4028;color:rgba(255,255,255,.85)}

/* AURINKO */
html[data-theme="aurinko"]{--ink:#2d2417;--paper:#fff8eb;--warm:#b48246;--accent:#c4681e;--muted:#7a6a4a;--light:#e8d8b8;--pomo:#c4681e;--q1:#c4681e;--q2:#3d6b30;--q3:#8a7a5a;--q4:#a0988a}
html[data-theme="aurinko"] body{background:#fff8eb}
html[data-theme="aurinko"] .task-card{background:#fffbf2;border-color:#e8d8b8}
html[data-theme="aurinko"] #queue-panel{background:#fffbf2;border-left-color:#e8d8b8}
html[data-theme="aurinko"] .act-btn{background:#fffbf2}
html[data-theme="aurinko"] .act-btn.skip{border-color:#e8d8b8}
html[data-theme="aurinko"] .time-opt{background:#fffbf2;border-color:#e8d8b8}
html[data-theme="aurinko"] .time-opt.on{border-color:#c4681e;color:#c4681e;background:rgba(196,104,30,.06)}
html[data-theme="aurinko"] .start-btn{background:#c4681e}
html[data-theme="aurinko"] .done-btn{background:#fffbf2;color:#c4681e;border-color:#c4681e}
html[data-theme="aurinko"] .done-btn:hover{background:#c4681e;color:white}
html[data-theme="aurinko"] .chip.inq{color:#c4681e;background:rgba(196,104,30,.10)}
html[data-theme="aurinko"] .tint.yes{background:rgba(196,104,30,.08)}

/* ── Mobiili ────────────────────────────────────────────────────────
   Kaksipalstainen asettelu (selausalue + 190px jonopaneeli) jättää
   puhelimessa kortille ~200px leveyttä. Kapealla ruudulla pinotaan:
   kortti saa koko leveyden ja jono jää matalaksi vyöksi alle. */
@media(max-width:699.98px){
  #main{flex-direction:column}
  #swipe-area{flex:1;min-height:0}
  #queue-panel{
    width:100%;
    max-height:32dvh;
    border-left:none;
    border-top:1px solid var(--light);
  }
  html[data-theme="havu"] #queue-panel{border-top-color:#1a3525}
  .qp-hdr{padding:.6rem .9rem .5rem}
  /* Toimintonapit kosketuskokoon. */
  .act-btn{min-width:56px;min-height:56px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<div id="setup">
  <div>
    <div style="font-family:'DM Serif Display',serif;font-size:1.4rem;font-style:italic;color:var(--accent);margin-bottom:.2rem">Fokus</div>
    <div style="font-size:.7rem;color:var(--muted);font-weight:300;letter-spacing:.08em;text-transform:uppercase">Tehtävien selaus</div>
  </div>
  <div><h2>Paljonko aikaa sinulla on?</h2><p>Työkalu ilmoittaa kun jonosi on täynnä.</p></div>
  <div class="time-opts" id="timeOpts">
    <button class="time-opt" data-min="30">30 min</button>
    <button class="time-opt" data-min="60">1 h</button>
    <button class="time-opt" data-min="90">1,5 h</button>
    <button class="time-opt" data-min="120">2 h</button>
    <button class="time-opt" data-min="180">3 h</button>
    <button class="time-opt" data-min="240">4 h</button>
  </div>
  <div class="custom-time">
    <span style="font-size:.75rem;color:var(--muted);font-weight:300">Tai kirjoita:</span>
    <input type="number" id="customMin" min="15" max="480" placeholder="min" aria-label="Mukautettu aika minuutteina">
    <span style="font-size:.75rem;color:var(--muted);font-weight:300">min</span>
  </div>
  <button class="start-btn" onclick="startSwipe()">Aloita selaus →</button>
  <button class="skip-setup" onclick="startSwipe(0)">Ohita — selaa ilman aikarajaa</button>
</div>

<div id="main">
  <div id="swipe-area">
    <div class="hdr">
      <button class="hdr-back" id="hdrBack" onclick="goBackToApp()">← Sulje</button>
      <span class="hdr-logo">Fokus</span>
      <div style="display:flex;align-items:center;gap:.5rem">
        <span class="hdr-count" id="counter">—</span>
        <button onclick="finishSwipe()" style="font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;padding:.35rem .8rem;border-radius:6px;border:1.5px solid var(--accent);color:var(--accent);background:white;cursor:pointer">Valmis ✓</button>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div class="hints" id="hints">
      <div class="hint left" id="hintLeft">✕ Ohita</div>
      <div style="font-size:.62rem;color:var(--muted);font-weight:300">pyyhkäise tai vedä</div>
      <div class="hint right" id="hintRight">Jonoon ✓</div>
    </div>
    <div class="stack" id="stack"></div>
    <div class="actions" id="actions">
      <div class="act-wrap"><button class="act-btn skip" onclick="swipeLeft()">✕</button><div class="act-label">Ohita</div></div>
      <div class="act-wrap"><button class="act-btn fbtn" id="frogBtn" onclick="swipeFrog()">🐸</button><div class="act-label">Sammakko</div></div>
      <div class="act-wrap"><button class="act-btn qbtn" onclick="swipeRight()">✓</button><div class="act-label">Jonoon</div></div>
    </div>
    <div id="done-screen">
      <div style="font-size:2rem">🌲</div>
      <h2>Kaikki selattu</h2>
      <p id="done-msg">Jono on valmis.</p>
      <button class="done-btn" id="doneBackBtn" onclick="goBackToApp()">Sulje ja siirry ajastimeen</button>
    </div>
  </div>
  <div id="queue-panel">
    <div class="qp-hdr"><div class="qp-title">Jono</div><div class="qp-budget" id="qpBudget"></div></div>
    <div class="budget-warn" id="budgetWarn"></div>
    <div class="qp-list" id="qpList"><div class="qp-empty">Ei tehtäviä</div></div>
    <div class="qp-total" id="qpTotal"></div>
  </div>
</div>

<div class="nt" id="nt"></div>

<!-- BEGIN fokus:edit-modal v1 — jaettu lohko. PIDÄ IDENTTISENÄ aamu.html <-> swipe.html.
     tests/run.py vertaa lohkot merkki merkiltä; ero kaataa ajon.
     Lohko käyttää vain popupeista löytyviä tokeneita (--ink/--paper/--muted/
     --light/--accent/--q1/--q2/--pomo), joten se seuraa isännän teemaa.
     Isäntä rekisteröi FokusEdit.init({tasks,queue,projects,persist,refresh,notify}). -->
<style>
#edit-overlay{display:none;position:fixed;inset:0;background:rgba(8,12,9,.55);z-index:400}
#edit-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,96vw);max-height:90vh;background:var(--paper);background:color-mix(in srgb, var(--paper) 90%, var(--ink) 10%);border:1px solid var(--light);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.45);z-index:500;flex-direction:column;overflow:hidden}
#edit-modal .fem-hd{padding:1.1rem 1.35rem .8rem;border-bottom:1px solid var(--light);font-family:'DM Serif Display',serif;font-size:1.1rem;font-style:italic;color:var(--ink)}
/* flex:1 pitaa footerin pohjassa kun modaali on mobiilissa koko ruudun korkea */
#edit-modal .fem-bd{padding:1.1rem 1.35rem;display:flex;flex-direction:column;gap:.85rem;overflow-y:auto;flex:1 1 auto}
#edit-modal .fem-ft{padding:.9rem 1.35rem 1.1rem;border-top:1px solid var(--light);display:flex;gap:.6rem}
#edit-modal .fem-lbl{font-size:.68rem;font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:.3rem}
#edit-modal .fem-in,#edit-modal textarea.fem-in{width:100%;box-sizing:border-box;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:300;padding:.55rem .8rem;border-radius:8px;border:1.5px solid var(--light);outline:none;color:var(--ink);background:var(--paper)}
#edit-modal textarea.fem-in{resize:vertical;min-height:48px}
#edit-modal .fem-in:focus{border-color:var(--accent)}
#edit-modal .fem-row{display:flex;gap:.4rem}
#edit-modal .fem-btn{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;padding:.55rem .8rem;border-radius:8px;border:1.5px solid var(--light);background:var(--paper);color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
#edit-modal .fem-btn:hover{border-color:var(--accent);color:var(--accent)}
#edit-modal .fem-tog{flex:1;text-align:center}
/* Valittu tila koskee myos sammakkonappia: pelkka taustavari jattaisi tekstin
   --mutediksi, joka on vaaleassa teemassa lukukelvoton tummalla pohjalla */
#edit-modal .fem-btn.on,#edit-modal .fem-btn.on:hover{color:#fff;border-color:transparent}
#edit-modal #edit-important.on{background:var(--q2)}
#edit-modal #edit-urgent.on{background:var(--q1)}
#edit-modal #edit-frog.on{background:var(--q2)}
#edit-modal .fem-est{display:flex;align-items:center;gap:.5rem;background:var(--paper);border:1px solid var(--light);border-radius:8px;padding:.4rem .8rem}
#edit-modal .fem-est input[type=range]{flex:1;min-width:0;accent-color:var(--pomo);height:4px;cursor:pointer}

<script>
/* Jaettu muokkausmodaali. Sama logiikka kuin index.html:n openEditModal /
   saveEditModal / editModalAction / _editDone — ilman ICS:aa ja jatkokorttia,
   jotka jaavat paaikkunaan. */
(function(){
  var H = null, release = null;
  var POMO = (function(){
    try{ var s=JSON.parse(localStorage.getItem('fap_timer_settings')||'{}');
         return (s.work>=5&&s.work<=90)?s.work:25; }catch(e){ return 25; }
  }());
  function q(id){ return document.getElementById(id); }
  function fe(v){ if(v===0)return'⚡'; if(v===.5)return'½';
    var w=Math.floor(v),h=v%1!==0; return h?(w>0?w+'½':'½'):String(w); }
  function isQuick(t){ return !!t && t.est===0; }
  function note(msg){ if(H&&H.notify)try{H.notify(msg);}catch(e){} }
  function tasksOf(){ return (H&&H.tasks&&H.tasks())||[]; }
  function queueOf(){ return (H&&H.queue&&H.queue())||[]; }
  function findTask(id){
    var a=tasksOf();
    for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; }
    return null;
  }
  function dropFromQueue(id){ var qa=queueOf(),i=qa.indexOf(id); if(i>=0)qa.splice(i,1); }
  function addToQueue(id){ var qa=queueOf(); if(qa.indexOf(id)<0)qa.push(id); }

  // text = verbi + ' ' + kuvaus — ICS-vienti ja verbi-chip lukevat naita
  function syncVerbiKuvaus(t){
    var m=(t.text||'').match(/^(\S+)\s+([\s\S]+)$/);
    if(m){ t.verbi=m[1]; t.kuvaus=m[2]; } else { t.verbi=t.text||''; t.kuvaus=''; }
  }
  function setEstUI(v){
    q('edit-ev').textContent=fe(v);
    q('edit-esl-unit').textContent=(v===0)?'alle 2 min — tee heti':'× '+POMO+' min';
  }
  function trapFocus(modal){
    var prev=document.activeElement;
    function focusables(){
      return Array.prototype.filter.call(
        modal.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
        function(el){ return el.offsetParent!==null; });
    }
    function onKey(e){
      if(e.key!=='Tab')return;
      var f=focusables(); if(f.length===0)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){
        e.preventDefault(); last.focus();
      } else if(!e.shiftKey&&document.activeElement===last){
        e.preventDefault(); first.focus();
      }
    }
    document.addEventListener('keydown',onKey);
    return function(){
      document.removeEventListener('keydown',onKey);
      if(prev&&prev.focus)try{prev.focus();}catch(e){}
    };
  }

  function isOpen(){ return q('edit-modal').style.display==='flex'; }

  function open(id){
    var t=findTask(id); if(!t)return;
    q('edit-modal-id').value=id;
    q('edit-text').value=t.text||'';
    q('edit-notes').value=t.lisatiedot||'';
    q('edit-link').value=t.linkki||'';
    q('edit-important').classList.toggle('on',!!t.important);
    q('edit-urgent').classList.toggle('on',!!t.urgent);
    q('edit-frog').classList.toggle('on',!!t.frog);
    var estVal=(t.est==null?1:t.est);
    q('edit-esl').value=estVal;
    setEstUI(estVal);

    // Projektisirut (vain nayttoa varten valittavissa; projektit tulevat isannalta)
    var pb=q('edit-proj-btns');
    pb.innerHTML='';
    var projects=(H&&H.projects&&H.projects())||[];
    if(projects.length){
      var noneB=document.createElement('button');
      noneB.type='button';
      noneB.className='fem-chip'+(!t.projectId?' active':'');
      noneB.textContent='— ei projektia —';
      noneB.dataset.pid='';
      if(!t.projectId){ noneB.style.borderColor='var(--accent)'; noneB.style.color='var(--accent)'; }
      pb.appendChild(noneB);
      projects.forEach(function(p){
        var b=document.createElement('button');
        b.type='button';
        var act=t.projectId===p.id;
        b.className='fem-chip'+(act?' active':'');
        b.style.borderColor=p.color;
        b.style.color=act?'#fff':p.color;
        b.style.background=act?p.color:'transparent';
        b.textContent=p.name;
        b.dataset.pid=p.id;
        pb.appendChild(b);
      });
      Array.prototype.forEach.call(pb.querySelectorAll('button'),function(btn){
        btn.addEventListener('click',function(e){
          e.stopPropagation();
          Array.prototype.forEach.call(pb.querySelectorAll('button'),function(b2){
            b2.classList.remove('active');
            var pid2=b2.dataset.pid;
            var p2=pid2?projects.find(function(p){return String(p.id)===String(pid2);}):null;
            b2.style.color=p2?p2.color:'var(--muted)';
            b2.style.borderColor=p2?p2.color:'var(--light)';
            b2.style.background='transparent';
          });
          btn.classList.add('active');
          var pid=btn.dataset.pid;
          var p3=pid?projects.find(function(p){return String(p.id)===String(pid);}):null;
          if(p3){ btn.style.color='#fff'; btn.style.background=p3.color; }
          else { btn.style.borderColor='var(--accent)'; btn.style.color='var(--accent)'; }
        });
      });
    }

    // Tilanapit: teksti ja toiminto riippuvat kortin tilasta
    var dnB=q('edit-done-btn'), wtB=q('edit-wait-btn');
    if(t.done){
      dnB.textContent='↩ Palauta tekemättömiin';
      dnB.setAttribute('aria-label','Palauta tekemättömiin');
      dnB.onclick=function(){ action(actRestore); };
      // Tehty kortti ei odota: odottavat-nakyma suodattaa done-kortit pois,
      // joten waiting jaisi tilaksi jota mikaan nakyma ei nayta
      wtB.style.display='none';
    }else{
      dnB.textContent='✓ Merkitse tehdyksi';
      dnB.setAttribute('aria-label','Merkitse tehdyksi');
      dnB.onclick=function(){ action(actDone); };
      wtB.style.display='';
      if(t.waiting){
        wtB.textContent='↩ Palauta vuoroon';
        wtB.setAttribute('aria-label','Palauta vuoroon');
        wtB.onclick=function(){ action(actUnwait); };
      }else{
        wtB.textContent='⏳ Siirrä odottamaan';
        wtB.setAttribute('aria-label','Siirrä odottamaan');
        wtB.onclick=function(){ action(actWait); };
      }
    }

    q('edit-overlay').style.display='block';
    q('edit-modal').style.display='flex';
    if(release)release();
    release=trapFocus(q('edit-modal'));
    setTimeout(function(){ try{q('edit-text').focus();}catch(e){} },50);
  }

  function close(){
    if(release){ release(); release=null; }
    q('edit-overlay').style.display='none';
    q('edit-modal').style.display='none';
  }

  function save(){
    var id=parseInt(q('edit-modal-id').value,10);
    var t=findTask(id); if(!t)return false;
    var txt=q('edit-text').value.trim();
    if(!txt)return false;
    t.text=txt;
    syncVerbiKuvaus(t);
    t.lisatiedot=q('edit-notes').value.trim()||null;
    t.linkki=q('edit-link').value.trim()||null;
    t.important=q('edit-important').classList.contains('on');
    t.urgent=q('edit-urgent').classList.contains('on');
    if(t.important&&t.urgent)t.quad='q1';
    else if(t.important&&!t.urgent)t.quad='q2';
    else if(!t.important&&t.urgent)t.quad='q3';
    else t.quad='q4';
    var _e=parseFloat(q('edit-esl').value);
    t.est=isNaN(_e)?1:_e;
    // 2 min -saanto: pikatehtava ei kuulu jonoon vaan omaan nippuunsa
    if(isQuick(t)){
      dropFromQueue(t.id);
      t.frog=false;
      note('⚡ Siirretty pikatehtäviin — tee se heti.');
    }
    var wantFrog=q('edit-frog').classList.contains('on');
    if(wantFrog&&!t.frog){ tasksOf().forEach(function(x){ x.frog=false; }); }
    // Pikatehtava ei voi olla sammakko — ehto toistetaan isQuick-haaran JALKEEN
    t.frog=wantFrog&&!isQuick(t);
    var actBtn=q('edit-proj-btns').querySelector('button.active');
    // dataset.pid on merkkijono, p.id numero → parseInt tai === menee epatodeksi
    if(actBtn)t.projectId=actBtn.dataset.pid?parseInt(actBtn.dataset.pid,10):null;
    if(H&&H.persist)H.persist(t);
    close();
    if(H&&H.refresh)H.refresh(t);
    return true;
  }

  // Tilanapin toiminto: tallenna kesken jaanyt muokkaus ENSIN, toimi vasta sitten.
  // Kortti otetaan talteen ENNEN tallennusta: save() kutsuu isannan refreshia,
  // joka voi pudottaa kortin listalta (odottava/tehty) — silloin id:lla etsiminen
  // ei enaa loytaisi sita ja toiminto jaisi hiljaa tekematta.
  function action(fn){
    var id=parseInt(q('edit-modal-id').value,10);
    var t=findTask(id);
    if(!save())return;  // tyhja teksti → modaali jaa auki, ei toimintoa
    if(t)fn(t);
  }
  function commit(t,msg){
    if(H&&H.persist)H.persist(t);
    if(H&&H.refresh)H.refresh(t);
    if(msg)note(msg);
  }
  function actDone(t){
    t.done=true; t.doneAt=new Date().toISOString();
    dropFromQueue(t.id);
    commit(t,'✓ Merkitty tehdyksi');
  }
  function actRestore(t){
    t.done=false; t.doneAt=null;
    commit(t,'↩ Palautettu tekemättömiin');
  }
  function actWait(t){
    t.waiting=true;
    dropFromQueue(t.id);
    commit(t,'Siirretty odottamaan');
  }
  function actUnwait(t){
    t.waiting=false;
    if(!isQuick(t)&&!t.done)addToQueue(t.id);
    commit(t,'Palautettu vuoroon');
  }

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&isOpen())close();
  });

  window.FokusEdit={
    init:function(host){ H=host; },
    open:open,
    close:close,
    isOpen:isOpen
  };

  // Lohkon skripti on modaalin DOM:in JALKEEN samassa dokumentissa, joten
  // elementit ovat olemassa — ei tarvita DOMContentLoadedia.
  (function(){
    q('edit-overlay').addEventListener('click',close);
    q('edit-cancel-btn').addEventListener('click',close);
    q('edit-save-btn').addEventListener('click',function(){ save(); });
    q('edit-important').addEventListener('click',function(){ this.classList.toggle('on'); });
    q('edit-urgent').addEventListener('click',function(){ this.classList.toggle('on'); });
    q('edit-frog').addEventListener('click',function(){ this.classList.toggle('on'); });
    q('edit-est-dn').addEventListener('click',function(){
      var s=q('edit-esl'); s.value=Math.max(0,parseFloat(s.value)-.5); setEstUI(parseFloat(s.value));
    });
    q('edit-est-up').addEventListener('click',function(){
      var s=q('edit-esl'); s.value=Math.min(8,parseFloat(s.value)+.5); setEstUI(parseFloat(s.value));
    });
    q('edit-esl').addEventListener('input',function(){ setEstUI(parseFloat(this.value)); });
  }());
})();
</script>
<!-- END fokus:edit-modal v1 -->

<script>
var QL={q1:'TEE HETI',q2:'AIKATAULUTA',q3:'DELEGOI',q4:'POISTA'};
var QC={q1:'Tärkeä + kiireinen',q2:'Tärkeä, ei kiireinen',q3:'Kiireinen, ei tärkeä',q4:'Ei tärkeä, ei kiireinen'};
var tasks=[],queue=[],active=null,turn=[],idx=0,total=0,budgetMin=0;
var projects=[];  // vain muokkausmodaalin projektisiruja varten
var POMO_MIN=(function(){try{var s=JSON.parse(localStorage.getItem('fap_timer_settings')||'{}');return(s.work>=5&&s.work<=90)?s.work:25;}catch(e){return 25;}}());
function fe(v){if(v===0)return'⚡';if(v===0.5)return'½';if(v%1!==0)return Math.floor(v)+'½';return String(v);}
// 2 min -saanto: est 0 = pikatehtava, ei kuulu tehtavajonoon
function isQuick(t){ return !!t && t.est===0; }

document.querySelectorAll('.time-opt').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.time-opt').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');document.getElementById('customMin').value='';
  });
});

function getSelectedMin(){
  var c=parseInt(document.getElementById('customMin').value);if(c>0)return c;
  var s=document.querySelector('.time-opt.on');return s?parseInt(s.dataset.min):0;
}

function startSwipe(override){
  budgetMin=(override===0)?0:getSelectedMin();
  loadData();
  document.getElementById('setup').style.display='none';
  document.getElementById('main').style.display='flex';
  renderStack();renderQueuePanel();
}

/* BEGIN fokus:sched v1 — jaettu lohko. PIDÄ IDENTTISENÄ
   index.html <-> aamu.html <-> swipe.html. Kopio on single-file-rajoitteen
   seuraus; tests/run.py:n shared_block vertaa kaikkia kolmea merkki
   merkiltä, joten ajautuminen kaataa testin. Muokkaa kaikkia kolmea.

   Lohko on puhdasta logiikkaa: se ei tallenna, piirrä eikä ilmoita mitään.
   Kutsuja hoitaa ne, koska save/render/notify ovat eri asioita
   pääsovelluksessa ja popupeissa. */
// Paikallinen YYYY-MM-DD. toISOString() antaa UTC-päivän, joka Suomessa
// (UTC+2/+3) on eri kuin kalenterissa keskiyön jälkeen — s.date-vertailu
// heittäisi vuorokauden joka yö.
function localDateStr(d){
  return d.getFullYear()+'-'
    +String(d.getMonth()+1).padStart(2,'0')+'-'
    +String(d.getDate()).padStart(2,'0');
}

// Onko ajastus erääntynyt? Puhdas predikaatti: ei lue kelloa eikä
// localStoragea, joten sen voi testata kiinteillä ajoilla.
//
// Vertailu on `<=`, ei `===`. Vanha täsmäminuuttivertailu vapautti tehtävän
// vain jos sovellus sattui olemaan auki juuri sillä minuutilla; muuten
// tehtävä jäi scheduled_hidden:true pysyvästi.
function scheduleDue(s,now,lastTriggered){
  if(!s)return false;
  var today=localDateStr(now);
  var hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(s.type==='once'){
    if(s.triggered)return false;
    return s.date<today||(s.date===today&&s.time<=hhmm);
  }
  if(s.type==='repeat'){
    // Menneitä päiviä ei kaiveta takaisin — päivittäinen rutiini ei saa
    // kasautua ruudulle viikon poissaolon jälkeen. Vain tämä päivä.
    if(lastTriggered===today)return false;
    return s.days.indexOf(now.getDay())>=0&&s.time<=hhmm;
  }
  return false;
}

// Ajastus ihmisluettavana. Renderöidään joka kerta tuoreena — tekstiä ei
// koskaan kirjoiteta t.lisatiedotiin, koska tallennus lukisi sen käyttäjän
// omaksi tekstiksi ja se monistuisi ja vanhentuisi.
var SCHED_DAY_NAMES=['Su','Ma','Ti','Ke','To','Pe','La'];

function fmtSchedDate(iso){
  var p=String(iso||'').split('-');
  if(p.length!==3)return String(iso||'');
  return parseInt(p[2],10)+'.'+parseInt(p[1],10)+'.'+p[0];
}

// Viikonpäivät luettavana. "Ma, Ti, Ke, To, Pe" ei mahdu pakkakortin
// leveyteen eikä kerro enempää kuin "arkisin".
function fmtSchedDays(days){
  var d=(days||[]).slice().sort(function(a,b){return a-b;});
  var key=d.join(',');
  if(key==='0,1,2,3,4,5,6')return 'päivittäin';
  if(key==='1,2,3,4,5')return 'arkisin';
  if(key==='0,6')return 'viikonloppuisin';
  // Maanantai ensin — sunnuntai (0) on suomalaisessa viikossa viimeinen.
  return d.map(function(x){return x===0?7:x;}).sort(function(a,b){return a-b;})
          .map(function(x){return SCHED_DAY_NAMES[x===7?0:x];}).join(', ');
}

// short=true pakkakortille, jossa rivi on 8px ja ~125px leveä.
function fmtSchedule(t,short){
  if(!t||!t.schedule)return '';
  var s=t.schedule;
  if(s.type==='once'){
    var pvm=fmtSchedDate(s.date);
    var when=pvm+' klo '+s.time;
    if(s.triggered)return '📅 Ilmestyi '+(short?pvm:when);
    // Erääntynyt mutta yhä piilossa: minuuttitarkistus ei ole vielä ehtinyt
    // ajaa. Kerrotaan se, ettei kortti näytä syyttä jumittavan.
    var myohassa=t.scheduled_hidden&&scheduleDue(s,new Date(),t.schedLast||null);
    return '📅 '+(short?'':'Ajastettu ')+when+(myohassa?' — myöhässä':'');
  }
  if(s.type==='repeat'){
    return '🔁 '+fmtSchedDays(s.days)+' klo '+s.time;
  }
  return '';
}

// Ilmestyykö tehtävä vasta myöhemmin kuin tänään? Aamusuunnittelu näyttää
// tänään ilmestyvät (ne kuuluvat tähän päivään) mutta ei lokakuun tehtävää.
function schedLaterThanToday(t,now){
  if(!t||!t.scheduled_hidden||!t.schedule)return false;
  var s=t.schedule;
  if(s.type==='once')return s.date>localDateStr(now);
  if(s.type==='repeat')return (s.days||[]).indexOf(now.getDay())<0;
  return false;
}

// Vapauttaa erääntyneet ajastukset. Mutatoi tehtäväoliot mutta ei tallenna
// eikä piirrä — kutsuja päättää mitä tehdä. Palauttaa vapautetut ja tiedon
// siitä muuttuiko data muuten (migraatio), jotta kutsuja osaa tallentaa.
function releaseDueSchedules(list,now){
  var today=localDateStr(now), released=[], changed=false;
  (list||[]).forEach(function(t){
    if(!t||t.done||!t.schedule)return;
    var s=t.schedule;
    // Migraatio: laukaisutieto oli localStoragessa, jolloin toistoajastus
    // laukesi uudelleen jokaisella laitteella erikseen. Nyt tehtävässä,
    // jolloin se synkkaa muun datan mukana.
    var lastKey='sched_last_'+t.id;
    if(t.schedLast===undefined){
      var legacy=null;
      try{legacy=localStorage.getItem(lastKey);}catch(e){}
      if(legacy){t.schedLast=legacy;changed=true;}
    }
    try{if(localStorage.getItem(lastKey)!==null)localStorage.removeItem(lastKey);}catch(e){}

    if(!scheduleDue(s,now,t.schedLast||null))return;
    if(s.type==='once')s.triggered=true;
    else t.schedLast=today;
    t.scheduled_hidden=false;
    released.push(t);
  });
  return {released:released,changed:changed};
}
/* END fokus:sched v1 */

// Turvallinen luku: rikki mennyt localStorage ei saa kaataa näkymää
function readData(){
  try{
    var wsId=localStorage.getItem('fap_active_ws')||'work';
    var raw=localStorage.getItem('eis_v5_'+wsId)||localStorage.getItem('eis_v5');
    if(!raw)return null;
    var d=JSON.parse(raw);
    if(!d||typeof d!=='object')return null;
    if(!Array.isArray(d.tasks))d.tasks=[];
    return d;
  }catch(e){
    console.warn('Fokus: tehtävädatan luku epäonnistui',e);
    return null;
  }
}

function loadData(){
  var d=readData();
  if(!d){tasks=[];queue=[];active=null;turn=[];total=0;projects=[];return;}
  // Ajastettujen vapautus. Selaus aukeaa myös PWA-pikakuvakkeesta ilman
  // pääsovellusta (manifest.json), jolloin mikään muu ei ajaisi tarkistusta.
  var relSrc=releaseDueSchedules(d.tasks,new Date());
  if(relSrc.released.length||relSrc.changed){
    d.updatedAt=Date.now();
    try{
      var wsId2=localStorage.getItem('fap_active_ws')||'work';
      localStorage.setItem('eis_v5_'+wsId2,JSON.stringify(d));
    }catch(e){ console.warn('Fokus: ajastusten vapautuksen tallennus epäonnistui',e); }
    try{ if(window.opener&&window.opener._scheduleFsSave) window.opener._scheduleFsSave(); }catch(e){}
  }
  // Pakka näyttää myös ajastetut: sen sopimus on näyttää kortti ja merkitä
  // tila, ei piilottaa. Sama periaate kuin odottavilla korteilla.
  tasks=JSON.parse(JSON.stringify(d.tasks)).filter(function(t){return !t.done&&!isQuick(t)});
  projects=Array.isArray(d.projects)?d.projects:[];
  // Migraatio: vanha queue[] → active+turn
  if(d.active!==undefined){
    active=d.active;
    turn=(d.turn||[]).slice();
  } else {
    var oldQ=(d.queue||[]);
    active=oldQ.length>0?oldQ[0]:null;
    turn=oldQ.slice(1);
  }
  // Sisäinen queue = [active, ...turn] helpottamaan swipe-logiikkaa
  queue=(active?[active]:[]).concat(turn).filter(function(id){
    return tasks.find(function(t){return t.id===id});
  });
  var qo={q1:0,q2:1,q3:2,q4:3};
  tasks.sort(function(a,b){
    if(a.frog&&!b.frog)return -1;if(!a.frog&&b.frog)return 1;
    return (qo[a.quad]||3)-(qo[b.quad]||3);
  });
  total=tasks.length;
}

function saveQueue(){
  var wsId=localStorage.getItem('fap_active_ws')||'work';
  var key='eis_v5_'+wsId;
  var d=readData();
  if(!d)return;
  // Synkronoi sisäinen queue → active+turn
  active=queue.length>0?queue[0]:null;
  turn=queue.slice(1);
  d.active=active;
  d.turn=turn;
  delete d.queue; // poistetaan vanha kenttä
  // tasks on syväkopio (loadData) → muokkaukset EIVÄT näy d.tasks:issa itsestään.
  // Kopioi kaikki kentät, joita tämä näkymä voi muuttaa.
  tasks.forEach(function(t){
    var o=d.tasks.find(function(u){return u.id===t.id});
    if(!o)return;
    o.frog=t.frog;
    o.text=t.text;
    o.important=t.important;
    o.urgent=t.urgent;
    o.quad=t.quad;
    o.verbi=t.verbi;
    o.kuvaus=t.kuvaus;
    o.est=t.est;
    o.lisatiedot=t.lisatiedot;
    o.linkki=t.linkki;
    // Muokkausmodaalin tilanapit: listan ulkopuolinen kentta ei tallennu
    o.waiting=t.waiting;
    o.projectId=t.projectId;
    // done kirjoitetaan vain tosi-suuntaan: pakassa on pelkkia tekemattomia,
    // joten o.done=false ylikirjoittaisi paaikkunassa juuri tehdyn kortin
    if(t.done){ o.done=true; o.doneAt=t.doneAt; }
  });
  d.updatedAt=Date.now(); // last-write-wins -leima pilvisynkkaan
  localStorage.setItem(key,JSON.stringify(d));
  // Delegoi pilvitallennus pääikkunalle (Firebase-SDK vain siellä)
  try{ if(window.opener&&window.opener._scheduleFsSave) window.opener._scheduleFsSave(); }catch(e){}
}

// Yksi hakukartta: muistin tehtävät voittavat, tallennettu data täydentää
function taskLookup(){
  var map={},d=readData();
  (d?d.tasks:[]).forEach(function(t){if(t&&t.id!==undefined)map[t.id]=t;});
  tasks.forEach(function(t){if(t&&t.id!==undefined)map[t.id]=t;});
  return map;
}

function queueTotalMin(lookup){
  var map=lookup||taskLookup();
  return queue.reduce(function(s,id){
    var t=map[id];
    return s+(t?(t.est||1)*POMO_MIN:POMO_MIN);
  },0);
}

function renderStack(){
  var stack=document.getElementById('stack');stack.innerHTML='';
  if(idx>=tasks.length){showDone();return;}
  if(idx+2<tasks.length)stack.appendChild(buildCard(tasks[idx+2],2));
  if(idx+1<tasks.length)stack.appendChild(buildCard(tasks[idx+1],1));
  var wrap=buildCard(tasks[idx],0);wrap.id='active-card';stack.appendChild(wrap);
  setupDrag(wrap);
  var anyFrog=tasks.some(function(t){return t.frog});
  var fb=document.getElementById('frogBtn');if(fb)fb.style.opacity=(anyFrog&&!tasks[idx].frog)?'0.35':'1';
  document.getElementById('counter').textContent=(tasks.length-idx)+' tehtävää';
  document.getElementById('prog').style.width=(total>0?Math.round(idx/total*100):0)+'%';
}

function buildCard(t,shadow){
  var wrap=document.createElement('div');
  wrap.className='card-wrap'+(shadow?(' shadow-card'+(shadow===2?' back2':'')):'');
  var card=document.createElement('div');card.className='task-card '+(t.quad||'q4');
  card.appendChild(Object.assign(document.createElement('div'),{className:'tint yes'}));
  card.appendChild(Object.assign(document.createElement('div'),{className:'tint no'}));
  var hdr=document.createElement('div');hdr.className='card-hdr';
  var badge=document.createElement('span');badge.className='q-badge '+(t.quad||'q4');badge.textContent=QL[t.quad||'q4'];
  var crit=document.createElement('div');crit.className='q-criteria';crit.textContent=QC[t.quad||'q4'];
  hdr.appendChild(badge);hdr.appendChild(crit);card.appendChild(hdr);
  var name=document.createElement('div');name.className='task-name';name.textContent=t.text;card.appendChild(name);
  var meta=document.createElement('div');meta.className='meta';
  var pi=document.createElement('div');pi.className='meta-item';pi.textContent='🍅 '+fe(t.est||1)+' pomodoro'+((t.est||1)>1?'a':'');meta.appendChild(pi);
  if(queue.indexOf(t.id)>=0){var c=document.createElement('span');c.className='chip inq';c.textContent='Jonossa';meta.appendChild(c);}
  if(t.frog){var c2=document.createElement('span');c2.className='chip frog';c2.textContent='🐸';meta.appendChild(c2);}
  if(t.waiting){var c3=document.createElement('span');c3.className='chip wait';c3.textContent='⏳';meta.appendChild(c3);}
  // Ajastettu, ei vielä ilmestynyt: siru kertoo tilan, rivi kertoo milloin.
  if(t.scheduled_hidden&&t.schedule){
    var c4=document.createElement('span');c4.className='chip sched';c4.textContent='🕐 Ajastettu';meta.appendChild(c4);
  }
  card.appendChild(meta);
  var schedTxt=fmtSchedule(t);
  if(schedTxt){
    var sl=document.createElement('div');sl.className='card-sched';sl.textContent=schedTxt;
    card.appendChild(sl);
  }
  // Tags row
  if(t.tags&&t.tags.length){
    var tagsRow=document.createElement('div');
    tagsRow.style.cssText='display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.3rem';
    t.tags.forEach(function(tag){
      var tg=document.createElement('span');
      tg.style.cssText='font-size:.58rem;font-weight:500;padding:.1rem .32rem;border-radius:4px;background:rgba(196,154,58,.1);color:var(--muted);border:1px solid rgba(196,154,58,.18)';
      tg.textContent='#'+tag;
      tagsRow.appendChild(tg);
    });
    card.appendChild(tagsRow);
  }

  // Edit button (only on active card)
  if(!shadow){
    var editBtn=document.createElement('button');
    editBtn.style.cssText='font-family:\'DM Sans\',sans-serif;font-size:.65rem;font-weight:400;padding:.2rem .55rem;border-radius:4px;border:1px solid var(--light);color:var(--muted);background:white;cursor:pointer;margin-top:.35rem;align-self:flex-start';
    editBtn.textContent='✎ Muokkaa';
    editBtn.onclick=function(e){e.stopPropagation();FokusEdit.open(t.id);};
    card.appendChild(editBtn);
  }

  wrap.appendChild(card);return wrap;
}

// Jaettu muokkausmodaali (ks. fokus:edit-modal -lohko). Korvasi oman
// #edit-panelin: sama lomake ja samat tilanapit kuin index.html:ssa.
FokusEdit.init({
  tasks:    function(){ return tasks; },
  queue:    function(){ return queue; },
  projects: function(){ return projects; },
  persist:  function(){ saveQueue(); },
  notify:   notify,
  refresh:  function(t){
    // Pakka nayttaa odottavatkin kortit (loadData ei suodata niita, ⏳-siru
    // kertoo tilan) — pudotettavia ovat vain tehdyt ja pikatehtavat.
    if(t&&(t.done||isQuick(t))){
      var i=tasks.findIndex(function(u){return u.id===t.id;});
      if(i>=0){
        tasks.splice(i,1);
        total=tasks.length;
        if(i<idx)idx--;
        if(idx>tasks.length)idx=tasks.length;
      }
    }
    renderStack();renderQueuePanel();
  }
});

function finishSwipe(){
  saveQueue();
  showDone();
}

function showDone(){
  document.getElementById('stack').style.display='none';
  document.getElementById('actions').style.display='none';
  document.getElementById('hints').style.display='none';
  document.getElementById('done-screen').style.display='flex';
  document.getElementById('prog').style.width='100%';
  document.getElementById('counter').textContent='Valmis';
  var q=queue.length,m=queueTotalMin();
  document.getElementById('done-msg').textContent=q>0?(q+' tehtävää jonossa ('+m+' min). Sulje ja käynnistä ajastin.'):'Ei tehtäviä jonossa.';
  saveQueue();
}

function renderQueuePanel(){
  var list=document.getElementById('qpList');list.innerHTML='';
  var map=taskLookup();
  var m=queueTotalMin(map);
  var bEl=document.getElementById('qpBudget');
  var wEl=document.getElementById('budgetWarn');
  if(budgetMin>0){
    bEl.textContent=m+' / '+budgetMin+' min';
    bEl.className='qp-budget'+(m>=budgetMin?' full':'');
    if(m>=budgetMin){wEl.textContent='Jono täynnä ('+m+'/'+budgetMin+' min). Ohita loput tai poista jonosta.';wEl.classList.add('on');}
    else wEl.classList.remove('on');
  } else {
    bEl.textContent=m>0?m+' min':'';wEl.classList.remove('on');
  }
  if(!queue.length){list.innerHTML='<div class="qp-empty">Ei tehtäviä</div>';document.getElementById('qpTotal').textContent='';return;}
  queue.forEach(function(id){
    var t=map[id];
    if(!t)return;
    var item=document.createElement('div');item.className='qp-item';
    var dot=document.createElement('div');dot.className='qp-dot '+(t.quad||'q4');
    var nm=document.createElement('div');nm.className='qp-name';nm.textContent=(t.frog?'🐸 ':'')+t.text;
    var est=document.createElement('div');est.className='qp-est';est.textContent=fe(t.est||1)+'🍅';
    var rm=document.createElement('button');rm.className='qp-rm';rm.textContent='×';
    rm.onclick=(function(tid){return function(){
      queue=queue.filter(function(i){return i!==tid});
      saveQueue();renderQueuePanel();renderStack();
    }})(id);
    item.appendChild(dot);item.appendChild(nm);item.appendChild(est);item.appendChild(rm);
    list.appendChild(item);
  });
  var h=Math.floor(m/60),mi=m%60;
  document.getElementById('qpTotal').innerHTML='Yhteensä: <strong>'+(h>0?h+'h '+(mi?mi+'min':''):mi+'min')+'</strong>';
}

function checkBudget(){return budgetMin>0&&queueTotalMin()>=budgetMin;}

function swipeRight(){
  var t=tasks[idx];if(!t)return;
  if(checkBudget()){notify('Jono täynnä! Poista ensin tai ohita.');return;}
  if(queue.indexOf(t.id)<0){queue.push(t.id);saveQueue();notify('✓ Lisätty jonoon');}
  else notify('Jo jonossa');
  renderQueuePanel();animateCard('right');
}

function swipeLeft(){notify('Ohitettu');animateCard('left');}

function swipeFrog(){
  var t=tasks[idx];if(!t)return;
  tasks.forEach(function(u){u.frog=false;});t.frog=true;
  if(queue.indexOf(t.id)<0)queue.unshift(t.id);
  else{queue=queue.filter(function(i){return i!==t.id});queue.unshift(t.id);}
  saveQueue();renderQueuePanel();notify('🐸 Sammakko — jonon kärkeen');animateCard('right');
}

function animateCard(dir){
  var wrap=document.getElementById('active-card');if(!wrap)return;
  wrap.classList.add('animating');
  wrap.style.transform='translateX('+(dir==='right'?window.innerWidth*1.2:-window.innerWidth*1.2)+'px) rotate('+(dir==='right'?16:-16)+'deg)';
  wrap.style.opacity='0';
  setTimeout(function(){idx++;renderStack();renderQueuePanel();},300);
}

function setupDrag(wrap){
  var startX=0,curX=0,dragging=false;
  var tyes=wrap.querySelector('.tint.yes'),tno=wrap.querySelector('.tint.no');
  function onStart(e){dragging=true;startX=e.touches?e.touches[0].clientX:e.clientX;wrap.style.transition='none';wrap.classList.remove('animating');}
  function onMove(e){
    if(!dragging)return;e.preventDefault();
    curX=(e.touches?e.touches[0].clientX:e.clientX)-startX;
    wrap.style.transform='translateX('+curX+'px) rotate('+(curX*0.07)+'deg)';
    var f=Math.min(Math.abs(curX)/100,1);
    if(curX>15){tyes.style.opacity=f*.55;tno.style.opacity=0;document.getElementById('hintRight').classList.add('active');document.getElementById('hintLeft').classList.remove('active');}
    else if(curX<-15){tno.style.opacity=f*.55;tyes.style.opacity=0;document.getElementById('hintLeft').classList.add('active');document.getElementById('hintRight').classList.remove('active');}
    else{tyes.style.opacity=0;tno.style.opacity=0;document.getElementById('hintLeft').classList.remove('active');document.getElementById('hintRight').classList.remove('active');}
  }
  function onEnd(){
    if(!dragging)return;dragging=false;
    document.getElementById('hintLeft').classList.remove('active');document.getElementById('hintRight').classList.remove('active');
    if(curX>80)swipeRight();else if(curX<-80)swipeLeft();
    else{wrap.classList.add('animating');wrap.style.transform='';wrap.style.opacity='1';tyes.style.opacity=0;tno.style.opacity=0;}
    curX=0;
  }
  wrap.addEventListener('touchstart',onStart,{passive:true});
  wrap.addEventListener('touchmove',onMove,{passive:false});
  wrap.addEventListener('touchend',onEnd);
  wrap.addEventListener('mousedown',onStart);
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
}

document.addEventListener('keydown',function(e){
  // Kirjainoikopolut eivät saa laueta kirjoitettaessa eivätkä
  // muokkauspaneelin ollessa auki — 'a' ja 'd' ovat tavallisia kirjaimia
  var tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable))return;
  if(window.FokusEdit&&FokusEdit.isOpen())return;
  if(e.key==='ArrowRight'||e.key==='d')swipeRight();
  else if(e.key==='ArrowLeft'||e.key==='a')swipeLeft();
  else if(e.key==='f')swipeFrog();
});

function notify(msg){var e=document.getElementById('nt');e.textContent=msg;e.classList.add('on');clearTimeout(notify._t);notify._t=setTimeout(function(){e.classList.remove('on')},2200);}

/* Teema-init */

  var t=localStorage.getItem('fap_theme')||'usva';
  document.documentElement.setAttribute('data-theme',t);
})();

// ── PALUU PÄÄSOVELLUKSEEN ─────────────────────────────
// Mobiilissa selaus avataan samaan välilehteen (?back=1), koska
// window.open avaisi siellä välilehden jolta opener-delegointi ei toimi.
// window.close() ei voi sulkea välilehteä jota se ei itse avannut, joten
// paluu on tehtävä historian kautta.
//
// Ei haarauteta window.openerin olemassaolon perusteella: opener voi olla
// olemassa vaikka ikkuna ei sulkeudu (iOS, noopener) ja toisin päin.
// Luotettava tapa on yrittaa sulkea ja varmistaa viiveella.
var _backTimer=null;
function goBackToApp(){
  // Tuo paaikkuna eteen ennen sulkemista — paluu tarkoittaa etta Fokus on
  // edessa, ei etta popup vain katoaa jonnekin taakse.
  try{ if(window.opener&&!window.opener.closed) window.opener.focus(); }catch(e){}
  try{ window.close(); }catch(e){}
  // window.closed ei ole luotettavasti tosi synkronisesti → varmistus viiveella.
  clearTimeout(_backTimer);
  _backTimer=setTimeout(function(){
    if(history.length>1) history.back();
    else location.href='index.html';
  },150);
}
// bfcachesta palautuva sivu ei saa navigoida itsestaan eteenpain-napin jalkeen
window.addEventListener('pagehide',function(){ clearTimeout(_backTimer); });
(function(){
  try{
    var sameTab=new URLSearchParams(location.search).get('back')==='1'||!window.opener;
    if(!sameTab) return;
    var b=document.getElementById('hdrBack');
    if(b)b.textContent='← Takaisin';
    // Samassa valilehdessa mitaan ei suljeta — nappi ei saa luvata sita
    var d=document.getElementById('doneBackBtn');
    if(d)d.textContent='Siirry ajastimeen →';
  }catch(e){/* napit jaavat oletusteksteihin */}
})();
